name: Deploy to Staging

on:
  push:
    branches: [homologacion]
  workflow_dispatch:

concurrency:
  group: deploy-homologacion
  cancel-in-progress: true

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Run pytest
        working-directory: api
        run: python -m pytest

  deploy:
    name: Migrate + Deploy
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_HOMOLOGACION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Run database migrations
        working-directory: api
        run: alembic upgrade head
      - name: Trigger Render deploy
        run: curl -sS -X POST -f "${{ secrets.RENDER_HOMOLOGACION_DEPLOY_HOOK }}"
      - name: Trigger Vercel build
        run: curl -sS -X POST -f "${{ secrets.VERCEL_HOMOLOGACION_BUILD_HOOK }}"
